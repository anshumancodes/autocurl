name: Release autocurl CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Configure C compiler (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Linux" ]; then command -v gcc; else command -v clang; fi
      - name: Configure C compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command gcc -ErrorAction Stop | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'CC=gcc'
      - name: Verify native target (Unix)
        if: runner.os != 'Windows'
        working-directory: cli
        shell: bash
        run: |
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
      - name: Verify native target (Windows)
        if: runner.os == 'Windows'
        working-directory: cli
        shell: pwsh
        run: |
          if ((go env GOOS) -ne 'windows' -or (go env GOARCH) -ne 'amd64') { throw "Unexpected Go target" }
      - name: Build and package binary (Unix)
        if: runner.os != 'Windows'
        working-directory: cli
        shell: bash
        env:
          CGO_ENABLED: "1"
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/package/autocurl ./cmd/autocurl
          test "$(dist/package/autocurl --version)" = "autocurl ${VERSION}"
          archive="autocurl_${VERSION}_${TARGET_GOOS}_${TARGET_GOARCH}.tar.gz"
          tar -C dist/package -czf "dist/${archive}" autocurl
      - name: Build and package binary (Windows)
        if: runner.os == 'Windows'
        working-directory: cli
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          go build -trimpath "-ldflags=-s -w -X main.version=$($env:VERSION)" -o dist/package/autocurl.exe ./cmd/autocurl
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          $versionOutput = & dist/package/autocurl.exe --version
          if ($LASTEXITCODE -ne 0 -or $versionOutput -ne "autocurl $env:VERSION") { throw "Unexpected binary version: $versionOutput" }
          Compress-Archive -Path dist/package/autocurl.exe -DestinationPath "dist/autocurl_${env:VERSION}_windows_amd64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/dist/autocurl_*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Verify and publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Verify archives and create checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected=(
            "autocurl_${VERSION}_linux_amd64.tar.gz"
            "autocurl_${VERSION}_linux_arm64.tar.gz"
            "autocurl_${VERSION}_darwin_amd64.tar.gz"
            "autocurl_${VERSION}_darwin_arm64.tar.gz"
            "autocurl_${VERSION}_windows_amd64.zip"
          )
          for archive in "${expected[@]}"; do
            test -s "dist/$archive" || { echo "Missing or empty release archive: $archive" >&2; exit 1; }
            case "$archive" in
              *.tar.gz) test "$(tar -tzf "dist/$archive")" = autocurl || { echo "Invalid archive contents: $archive" >&2; exit 1; } ;;
              *.zip) test "$(unzip -Z1 "dist/$archive")" = autocurl.exe || { echo "Invalid archive contents: $archive" >&2; exit 1; } ;;
            esac
          done
          actual=$(find dist -maxdepth 1 -type f -name 'autocurl_*' -printf '%f\n' | sort)
          wanted=$(printf '%s\n' "${expected[@]}" | sort)
          test "$actual" = "$wanted" || { echo "Unexpected release archive set" >&2; exit 1; }
          (cd dist && sha256sum "${expected[@]}" > checksums.txt)
          (cd dist && sha256sum --check checksums.txt)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
