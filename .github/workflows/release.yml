name: Release autocurl CLI

on:
  push:
    branches:
      - publish
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Configure C compiler (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v gcc
            gcc --version
            echo "CC=gcc" >> "$GITHUB_ENV"
          else
            command -v clang
            clang --version
            echo "CC=clang" >> "$GITHUB_ENV"
          fi

      - name: Configure C compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gcc = Get-Command gcc -ErrorAction Stop
          & $gcc.Source --version
          Add-Content -Path $env:GITHUB_ENV -Value 'CC=gcc'

      - name: Verify native target
        working-directory: cli
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set -eu
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"

      - name: Verify native target (Windows)
        working-directory: cli
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          if ((go env GOOS) -ne '${{ matrix.goos }}') { throw "Unexpected GOOS" }
          if ((go env GOARCH) -ne '${{ matrix.goarch }}') { throw "Unexpected GOARCH" }

      - name: Build and package binary (Unix)
        working-directory: cli
        if: runner.os != 'Windows'
        shell: bash
        env:
          CGO_ENABLED: "1"
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist/package
          binary="autocurl"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/package/${binary}" \
            ./cmd/autocurl

          archive_base="autocurl_${VERSION}_${TARGET_GOOS}_${TARGET_GOARCH}"
          tar -C dist/package -czf "dist/${archive_base}.tar.gz" "${binary}"

      - name: Build and package binary (Windows)
        working-directory: cli
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          $binary = 'autocurl.exe'
          go build -trimpath "-ldflags=-s -w -X main.version=$($env:VERSION)" -o (Join-Path dist/package $binary) ./cmd/autocurl
          if ($LASTEXITCODE -ne 0) { throw "go build failed with exit code $LASTEXITCODE" }

          $archiveBase = "autocurl_${env:VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          Compress-Archive `
            -Path (Join-Path dist/package $binary) `
            -DestinationPath (Join-Path dist "$archiveBase.zip") `
            -Force

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/dist/autocurl_*
          if-no-files-found: error
          retention-days: 1

  checksums:
    name: Create checksums
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' && (github.ref == 'refs/heads/publish' || startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: dist
        run: sha256sum autocurl_* > checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: checksums
    if: ${{ needs.checksums.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
