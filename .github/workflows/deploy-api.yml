name: Deploy autocurl API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy API to DigitalOcean
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -eu
          test -n "$DO_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      - name: Install Compose file on the VM
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_PORT: ${{ secrets.DO_SSH_PORT }}
        run: |
          set -eu
          test -n "$DO_HOST"
          test -n "$DO_USER"
          port="${DO_SSH_PORT:-22}"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -p "$port" -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_opts[@]}" "$DO_USER@$DO_HOST" 'mkdir -p /opt/autocurl/api'
          scp "${ssh_opts[@]}" api/compose.yaml "$DO_USER@$DO_HOST:/opt/autocurl/api/compose.yaml"

      - name: Authenticate and deploy exact image
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_PORT: ${{ secrets.DO_SSH_PORT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          port="${DO_SSH_PORT:-22}"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -p "$port" -o StrictHostKeyChecking=accept-new)
          image="$(printf '%s' "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"

          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "$DO_USER@$DO_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

          ssh "${ssh_opts[@]}" "$DO_USER@$DO_HOST" \
            "GHCR_IMAGE='$image' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -eu
          cd /opt/autocurl/api

          # Pull and migrate the exact SHA image before replacing the running API.
          # A failed migration exits here and prevents the new API from starting.
          docker compose pull api migrate
          docker compose run --rm migrate
          docker compose up -d --no-deps api

          container_id="$(docker compose ps -q api)"
          test -n "$container_id"
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"
            case "$status" in
              healthy)
                curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null
                echo "API container is healthy"
                exit 0
                ;;
              unhealthy)
                docker compose logs --tail=100 api >&2
                echo "API container became unhealthy" >&2
                exit 1
                ;;
            esac
            sleep 2
          done
          docker compose logs --tail=100 api >&2
          echo "Timed out waiting for API health check" >&2
          exit 1
          REMOTE
